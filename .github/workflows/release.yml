name: release

on:
  workflow_dispatch:
    inputs:
      digest:
        description: "Image digest to release (sha256:...)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.digest }}

jobs:
  # 1-3: verify every attestation, build the evidence bundle from verified payloads only, ask OPA.
  verify-decide:
    runs-on: ubuntu-24.04
    outputs:
      decision: ${{ steps.opa.outputs.decision }}
    steps:
      - name: Validate input
        env:
          DIGEST: ${{ inputs.digest }}
        run: '[[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::bad digest"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        run: |
          TOOLS="cosign slsa-verifier opa" scripts/install-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify provenance + scan attestations
        env:
          DIGEST: ${{ inputs.digest }}
          REPO: ${{ github.repository }}
        run: scripts/verify.sh "$DIGEST"
      - name: Evidence bundle (verified attestations only)
        env:
          DIGEST: ${{ inputs.digest }}
        run: python3 scripts/bundle.py evidence "$DIGEST" > evidence/evidence.json
      - name: OPA decision
        id: opa
        run: |
          opa eval --format raw -d policy/release.rego -d policy/thresholds.json \
            -i evidence/evidence.json 'json.marshal(data.release.decision)' > evidence/decision.json
          cat evidence/decision.json
          echo "decision=$(jq -r .decision evidence/decision.json)" >> "$GITHUB_OUTPUT"
          { echo "### Decision: \`$(jq -r .decision evidence/decision.json)\`"; jq -r '.reasons[] | "- " + .' evidence/decision.json; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence
          path: evidence/

  # 4: open the change request. Tokens live only in the protected `release` environment.
  change-request:
    needs: verify-decide
    runs-on: ubuntu-24.04
    environment: release
    outputs:
      cr: ${{ steps.cr.outputs.cr }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evidence
          path: evidence
      - name: POST /snow/change
        id: cr
        env:
          MOCK_URL: ${{ vars.MOCK_URL }}
          CR_TOKEN: ${{ secrets.CR_TOKEN }}
          DIGEST: ${{ inputs.digest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg d "$DIGEST" --arg u "$RUN_URL" \
                --slurpfile dec evidence/decision.json --slurpfile ev evidence/evidence.json \
                '{digest:$d, run_url:$u, decision:$dec[0].decision, reasons:$dec[0].reasons, evidence:$ev[0]}' > cr.json
          resp="$(curl -fsS -X POST "$MOCK_URL/snow/change" -H "Authorization: Bearer $CR_TOKEN" \
                  -H 'Content-Type: application/json' --data @cr.json)"
          echo "$resp"
          echo "cr=$(jq -r .id <<<"$resp")" >> "$GITHUB_OUTPUT"
          echo "### Change request: \`$(jq -r .id <<<"$resp")\` → $(jq -r .state <<<"$resp")" >> "$GITHUB_STEP_SUMMARY"

  # 5: manual route waits here for a required reviewer on the `manual-approval` environment.
  manual-approval:
    needs: [verify-decide, change-request]
    if: needs.verify-decide.outputs.decision == 'manual'
    runs-on: ubuntu-24.04
    environment: manual-approval
    steps:
      - run: echo "Approved by a reviewer of the manual-approval environment."

  # 6: CI (and only CI) updates SD Elements; then record approval on the CR.
  sde-update:
    needs: [verify-decide, change-request, manual-approval]
    if: >-
      always() && needs.change-request.result == 'success' &&
      (needs.manual-approval.result == 'success' || needs.manual-approval.result == 'skipped')
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evidence
          path: evidence
      - name: PUT /sde/countermeasures
        env:
          MOCK_URL: ${{ vars.MOCK_URL }}
          SDE_TOKEN: ${{ secrets.SDE_CI_TOKEN }}
          DIGEST: ${{ inputs.digest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for pair in T-SAST:sast T-SCA:sca T-SECRETS:secrets; do
            cm="${pair%%:*}"; kind="${pair##*:}"
            # Complete only if a verified attestation exists and the policy-relevant counts are clean
            status="$(jq -r --arg k "$kind" '.scans[$k] as $s |
              if $s == null then "Incomplete"
              elif ($s.fixable.critical // 0) == 0 and ($s.fixable.secrets // 0) == 0 then "Complete"
              else "Incomplete" end' evidence/evidence.json)"
            body="$(jq -n --arg s "$status" --arg d "$DIGEST" --arg n "release run $RUN_URL digest $DIGEST" \
                    '{status:$s, note:$n, digest:$d}')"
            echo "$cm -> $status"
            curl -fsS -X PUT "$MOCK_URL/sde/countermeasures/$cm" -H "Authorization: Bearer $SDE_TOKEN" \
                 -H 'Content-Type: application/json' -d "$body"; echo
          done
      - name: Record manual approval on the CR
        if: needs.verify-decide.outputs.decision == 'manual'
        env:
          MOCK_URL: ${{ vars.MOCK_URL }}
          CR_TOKEN: ${{ secrets.CR_TOKEN }}
          CR: ${{ needs.change-request.outputs.cr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS -X PATCH "$MOCK_URL/snow/change/$CR" -H "Authorization: Bearer $CR_TOKEN" \
               -H 'Content-Type: application/json' \
               -d "$(jq -n --arg u "$RUN_URL" --arg a "$GITHUB_ACTOR" '{state:"approved", approver:$a, run_url:$u}')"

  # Final gate: a rejected release fails the run (after the CR and SDE have recorded it).
  gate:
    needs: [verify-decide, sde-update]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          DECISION: ${{ needs.verify-decide.outputs.decision }}
          SDE: ${{ needs.sde-update.result }}
        run: |
          echo "decision=$DECISION sde-update=$SDE"
          [ "$DECISION" != reject ] && [ "$SDE" = success ] || { echo "::error::release not approved"; exit 1; }
